<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" fill="none">
  <title>ToolBox — a shared workbench for telecom engineers</title>
  <desc>Conceptual illustration, not a screenshot. A lavender software workbench combines web interfaces, application features and unit tests.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c7c5df"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#40396e" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="680" rx="20" fill="#eeedf7"/>
  <rect x="450" width="750" height="680" fill="url(#dots)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="61" fill="#65568b" font-size="17" letter-spacing="3">WICRESOFT / ENGINEERING TOOLS</text>
    <text x="54" y="139" fill="#302a4f" font-size="56" font-weight="700">One workbench.</text>
    <text x="54" y="201" fill="#302a4f" font-size="56" font-weight="700">Many moving parts.</text>
    <text x="56" y="249" fill="#6d6680" font-size="22">A shared home for everyday engineering.</text>

    <g filter="url(#shadow)">
      <rect x="438" y="288" width="706" height="280" rx="16" fill="#fff"/>
      <path d="M454 288h674a16 16 0 0 1 16 16v36H438v-36a16 16 0 0 1 16-16" fill="#dbd7ef"/>
      <circle cx="461" cy="314" r="5" fill="#8574b0"/><circle cx="479" cy="314" r="5" fill="#aa9dc7"/><circle cx="497" cy="314" r="5" fill="#c0b6d6"/>
      <text x="534" y="321" fill="#514768" font-size="18" font-weight="700">ToolBox</text>
      <text x="968" y="321" fill="#655b7d" font-size="14">SHARED WORKSPACE</text>
      <path d="M438 340h154v228H454a16 16 0 0 1-16-16" fill="#f5f3fa"/>
      <rect x="456" y="365" width="117" height="33" rx="6" fill="#e4dff3"/>
      <text x="471" y="387" fill="#5d4e89" font-size="16">Applications</text>
      <path d="M471 425h73m-73 27h56m-56 27h64" stroke="#cbc6d8" stroke-width="6" stroke-linecap="round"/>
      <text x="620" y="383" fill="#403655" font-size="20" font-weight="700">Engineer workspace</text>
      <g>
        <rect x="620" y="405" width="145" height="133" rx="10" fill="#f0edf9"/>
        <rect x="642" y="425" width="37" height="29" rx="5" stroke="#8572af" stroke-width="2"/><path d="M642 434h37m-24-9v29" stroke="#8572af" stroke-width="2"/>
        <text x="640" y="487" fill="#51426f" font-size="19" font-weight="700">Interfaces</text>
        <text x="640" y="514" fill="#706384" font-size="16">jQuery · Jinja</text>
        <rect x="783" y="405" width="155" height="133" rx="10" fill="#e9f3f1"/>
        <path d="m817 429-12 12 12 12m26-24 12 12-12 12m-10-29-7 34" stroke="#47857d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="802" y="487" fill="#376a64" font-size="19" font-weight="700">Features</text>
        <text x="802" y="514" fill="#547d78" font-size="16">Python · React</text>
        <rect x="956" y="405" width="160" height="133" rx="10" fill="#f9eee5"/>
        <rect x="977" y="424" width="32" height="33" rx="5" stroke="#b47c51" stroke-width="2"/><path d="m983 440 7 7 12-15" stroke="#b47c51" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="975" y="487" fill="#8d5d3d" font-size="19" font-weight="700">Unit tests</text>
        <text x="975" y="514" fill="#967256" font-size="16">Validation</text>
      </g>
    </g>

    <rect x="54" y="340" width="318" height="188" rx="12" fill="#716093"/>
    <path d="M80 378h31m-31 9h21" stroke="#d9cdec" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="429" fill="#fff" font-size="26" font-weight="700">Built around the people</text>
    <text x="80" y="461" fill="#fff" font-size="26" font-weight="700">doing the work.</text>
    <text x="80" y="500" fill="#e3dbef" font-size="17">Managed Telecom Services</text>
    <path d="M54 604h1090" stroke="#d4cfe4"/>
    <text x="54" y="642" fill="#6d6580" font-size="17">CENTRALIZED WEB APPLICATIONS</text>
    <text x="867" y="642" fill="#6d6580" font-size="16">CONCEPT / NOT A PRODUCT SCREENSHOT</text>
  </g>
</svg>
