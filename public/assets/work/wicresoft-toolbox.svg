    <text x="48" y="117" fill="#302a4f" font-size="46" font-weight="700">Messaging services. Everyday tools.</text>
    <text x="50" y="158" fill="#6d6680" font-size="23">Backend functionality and interfaces for internal workflows.</text>

    <rect x="48" y="200" width="516" height="476" rx="18" fill="#51436f"/>
