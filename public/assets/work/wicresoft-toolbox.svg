<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <title>Wicresoft — messaging services and engineering tools</title>
  <desc>Concept illustration, not a product screenshot. Two separate panels show messaging backend features and the ToolBox web application suite: internal chat, system notifications, persistent message storage, chat history retrieval, jQuery and Jinja interfaces, Python backend functionality, and unit tests.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ccc7df"/></pattern>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#eeedf7"/>
  <rect x="650" width="550" height="190" fill="url(#dots)"/>
  <g font-family="Arial, Helvetica, sans-serif">
